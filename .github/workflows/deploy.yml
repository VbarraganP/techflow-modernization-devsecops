name: "TechFlow: Despliegue Inteligente en Azure"
# Este flujo de trabajo requiere los siguientes secretos configurados en GitHub:
#
# SECRETOS REQUERIDOS:
# - AZURE_CLIENT_ID       : ID del Cliente (App ID) del Service Principal.
# - AZURE_TENANT_ID       : ID del Inquilino (Directory ID) de Azure AD.
# - AZURE_SUBSCRIPTION_ID : ID de la Suscripción de Azure.
# - MY_SECRET_VALUE       : Un valor secreto que se pasa a Terraform (var.secret_value).
#
# VARIABLES DE REPOSITORIO (Github > Settings > Secrets and variables > Actions > Variables):
# - BACKEND_RG            : (Requerido) Grupo de recursos del backend (ej. rg-resource-admin)
# - BACKEND_SA            : (Requerido) Storage Account del backend (ej. terraforminfrastates)
# - BACKEND_CONTAINER     : (Requerido) Contenedor del backend (ej. tfstate)
# - ACR_NAME              : (Requerido) Nombre del Azure Container Registry (ej. techflowacr)
# - APP_NAME              : (Requerido) Nombre de la imagen para la aplicación API (ej. techflow-api)
# - JOB_NAME              : (Requerido) Nombre de la imagen para el Job (ej. techflow-job)
# - LOCATION              : (Requerido) Región de Azure (ej. eastus)
#
# NOTA: No se requiere AZURE_CLIENT_SECRET ya que se utiliza OIDC (identidad federada).
#
# PREREQUISITOS (Backend de Terraform):
# El estado de Terraform se almacena centralizadamente usando las variables de repositorio arriba mencionadas.
#
# ESTRATEGIA DE ENTORNOS:
# - Dev : Usa `infra/dev.tfvars` (rg-techflow-dev)
# - Prod: Usa `infra/prod.tfvars` (rg-techflow-prod)
# -----------------------------------------------------------------------------

on:
   push:
      branches: ["main", "develop"]
   pull_request:
      branches: ["main", "develop"]

permissions:
   id-token: write # Required for requesting the JWT for Azure OIDC
   contents: read # Required for actions/checkout

jobs:
   # -----------------------------------------------------------------------------
   # Phase 1: Security (IaC Scan) - tfsec
   # -----------------------------------------------------------------------------
   Security-IaC:
      name: "Security: IaC Scan (tfsec)"
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Run tfsec
           uses: aquasecurity/tfsec-action@v1.0.0
           with:
              working_directory: infra

   # -----------------------------------------------------------------------------
   # Phase 2: Build & Security (Docker) - Trivy
   # -----------------------------------------------------------------------------
   Build-and-Scan:
      name: "Build & Scan (Docker)"
      runs-on: ubuntu-latest
      needs: [Security-IaC] # Run after IaC scan passes
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         # Login to Azure to get ACR credentials for pushing (if needed later)
         - name: Azure Login
           uses: azure/login@v1
           with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

         - name: Login to ACR
           run: |
              az acr login --name ${{ vars.ACR_NAME }}

         # --- API Build & Scan ---
         - name: Build API Image
           run: |
              docker build -t ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }} ./app

         - name: Run Trivy Scanner (API)
           uses: aquasecurity/trivy-action@master
           with:
              image-ref: "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }}"
              format: "table"
              # exit-code: '1' # Uncomment to fail build on vulnerabilities
              ignore-unfixed: true
              vuln-type: "os,library"
              severity: "CRITICAL,HIGH"

         # --- Job Build & Scan ---
         - name: Build Job Image
           run: |
              docker build -t ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.JOB_NAME }}:${{ github.sha }} ./job

         - name: Run Trivy Scanner (Job)
           uses: aquasecurity/trivy-action@master
           with:
              image-ref: "${{ vars.ACR_NAME }}.azurecr.io/${{ vars.JOB_NAME }}:${{ github.sha }}"
              format: "table"
              # exit-code: '1'
              ignore-unfixed: true
              vuln-type: "os,library"
              severity: "CRITICAL,HIGH"

         # --- Push Images ---
         - name: Push Images to ACR
           if: success() # Only push if build and scans successful
           run: |
              docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }}
              docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.APP_NAME }}:latest --force 2>/dev/null || true

              docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.JOB_NAME }}:${{ github.sha }}
              docker push ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.JOB_NAME }}:latest --force 2>/dev/null || true

   # -----------------------------------------------------------------------------
   # Phase 3: Deploy Infrastructure - Terraform
   # -----------------------------------------------------------------------------
   Deploy-Infrastructure:
      name: "Deploy: Infrastructure (Terraform)"
      runs-on: ubuntu-latest
      needs: [Build-and-Scan]
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Azure Login
           uses: azure/login@v1
           with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

         - name: Set Environment Variables
           run: |
              if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                echo "ENV_NAME=prod" >> $GITHUB_ENV
                echo "TFVARS_FILE=prod.tfvars" >> $GITHUB_ENV
              else
                 echo "ENV_NAME=dev" >> $GITHUB_ENV
                 echo "TFVARS_FILE=dev.tfvars" >> $GITHUB_ENV
              fi

         - name: Setup Terraform
           uses: hashicorp/setup-terraform@v3

         - name: Terraform Init
           working-directory: infra
           run: |
              terraform init \
                -backend-config="resource_group_name=${{ vars.BACKEND_RG }}" \
                -backend-config="storage_account_name=${{ vars.BACKEND_SA }}" \
                -backend-config="container_name=${{ vars.BACKEND_CONTAINER }}" \
                -backend-config="key=${{ env.ENV_NAME }}.terraform.tfstate"
           env:
              ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
              ARM_USE_OIDC: true

         - name: Terraform Plan
           working-directory: infra
           run: |
              terraform plan \
                -var-file="${{ env.TFVARS_FILE }}" \
                -var="container_image=${{ vars.ACR_NAME }}.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }}" \
                -var="secret_value=${{ secrets.MY_SECRET_VALUE }}" \
                -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
                -out=tfplan
           env:
              ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
              ARM_USE_OIDC: true

         - name: Terraform Apply
           if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
           working-directory: infra
           run: terraform apply -auto-approve tfplan
           env:
              ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
              ARM_USE_OIDC: true
